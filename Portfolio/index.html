<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adama Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans">

  <!-- Header -->
  <header class="bg-gray-800 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Adama</h1>
    <nav class="space-x-4">
      <a href="#" class="hover:text-gray-300">Home</a>
      <a href="#" class="hover:text-gray-300">Projects</a>
      <a href="#" class="hover:text-gray-300">Contact</a>
    </nav>
  </header>

  <!-- Hero -->
 <section class="bg-cover bg-center h-96 flex items-center justify-center text-white" style="background-image:url('hero.jpg')">
  <h2 class="text-4xl font-bold">Hello, I'm Adama 👋</h2>
</section>

  <!-- Skills -->
  <section class="p-8">
    <h3 class="text-2xl font-bold mb-4">Skills</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-gray-100 p-4 rounded shadow">React</div>
      <div class="bg-gray-100 p-4 rounded shadow">Node.js</div>
      <div class="bg-gray-100 p-4 rounded shadow">IT Management</div>
      <div class="bg-gray-100 p-4 rounded shadow">Security</div>
    </div>
  </section>

  <!-- Projects -->
  <section class="p-8 bg-gray-50">
    <h3 class="text-2xl font-bold mb-4">Projects</h3>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="bg-white shadow rounded overflow-hidden">
        <img src="project.jpg" alt="Project" class="w-full">
        <div class="p-4">
          <h4 class="font-bold">Project 1</h4>
          <p class="text-gray-600">Description of project 1.</p>
        </div>
      </div>
      <!-- Repeat for other projects -->
    </div>
  </section>

  <!-- Contact -->
  <section class="p-8">
    <h3 class="text-2xl font-bold mb-4">Contact Me</h3>
    <form class="flex flex-col gap-4 max-w-md">
      <input type="text" placeholder="Name" class="border p-2 rounded">
      <input type="email" placeholder="Email" class="border p-2 rounded">
      <textarea placeholder="Message" class="border p-2 rounded"></textarea>
      <button class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Send</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white p-4 flex justify-between items-center">
    <p>&copy; 2026 Adama</p>
    <div class="space-x-4">
      <a href="#">Twitter</a>
      <a href="#">LinkedIn</a>
      <a href="#">GitHub</a>
    </div>
  </footer>

</body>
</html>
